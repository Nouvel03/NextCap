<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NextCap - Login with Email</title>
  <link rel="stylesheet" href="login_with_email.css">
  <!-- Firebase compat SDKs (same used in your other pages) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <!-- Secrets Config -->
  <script src="../utils/secrets.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>

<body>
  <div class="logo">
    <img src="images/main-logo.svg" alt="NextCap Logo" class="logo-img">

    <div class="logo-text">
        <h1 class="logo-title">NextCap</h1>
        <p class="logo-subtitle">
        Advancing Scholarship Applications for Tomorrow’s Leaders
        </p>
    </div>
    </div>

  <div class="login-container card active" id="login-card">
    <button class="back-button" onclick="history.back()">
      <img src="../Login page/images/back-svgrepo-com (1).svg" alt="Back">
    </button>
    <h2>Login with Email</h2>
    <p class="subtitle">Enter your email and password</p>

    <div class="form-group">
      <label for="login-email">Email</label>

      <input type="email" id="login-email" placeholder="your.email@example.com" autocomplete="email">
      <div class="error-message" id="login-email-error"></div>
    </div>

    <div class="form-group">
    <label for="code">Password</label>

    <div class="password-wrapper">
        <input type="password" id="code" placeholder="Enter your password">
        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <img src="images/eye-slash-svgrepo-com.svg" alt="Show password">
        </button>
    </div>
</div>


    <button class="continue-btn" id="login-btn">Log in</button>
    <div class="resend-code"></div>
  </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>

  <!-- Your Firebase init & helpers -->
  <script type="module" src="../FirebaseUtils/FirebaseUtils_Login.js"></script>
  <script type="module" src="login_with_email.js"></script>
</body>

</html>
