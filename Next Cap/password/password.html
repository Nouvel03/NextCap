<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextCap - login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="logo">
        <img src="images/Group 21.svg" alt="Scholarly Logo">
    </div>

    <img src="images/mobile_logo.svg" class="mobile-logo" alt="Mobile Logo">

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>
        <h2>Confirm your password</h2>
        <p class="subtitle">Enter your password again to make sure there's no mistake</p>

        <div class="form-group">
            <label for="code">Confirm password</label>
            <input type="text" id="code" placeholder="Enter your password">
        </div>
        <button class="continue-btn">Continue</button>
    </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>

    <script src="../app.js"></script>
</body>

</html>
