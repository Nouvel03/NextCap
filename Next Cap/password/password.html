<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextCap - login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="logo">
    <img src="images/main-logo.svg" alt="NextCap Logo" class="logo-img">

    <div class="logo-text">
        <h1 class="logo-title">NextCap</h1>
        <p class="logo-subtitle">
        Advancing Scholarship Applications for Tomorrow’s Leaders
        </p>
    </div>
    </div>
    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>
        <h2>Confirm your password</h2>
        <p class="subtitle">Enter your password again to make sure there are no mistakes.</p>
        
        <div class="form-group">
    <label for="code">Confirm password</label>

    <div class="password-wrapper">
        <input type="password" id="code" placeholder="Enter your password">
        <button type="button" class="toggle-password" aria-label="Toggle password visibility">
            <img src="images/eye-slash-svgrepo-com.svg" alt="Show password">
        </button>
    </div>
</div>

        <button class="continue-btn">Continue</button>
    </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>
    <script src="js-eye.js"></script>
    <script src="../app.js"></script>
</body>
</html>
