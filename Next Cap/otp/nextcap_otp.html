<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>OTP | NextCap</title>
    <link rel="icon" href="../favicon_io/favicon.ico" type="image/x-icon">
    <!-- Google Identity Services - Required for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="logo">
        <img src="images/Group 21.svg" alt="Scholarly Logo">
    </div>

    <div class="cap">
        <img src="images/Group 11.svg" alt="tilted graduation cap">
    </div>

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>
        <h2>You're almost signed up</h2>
        <p class="subtitle">Enter the code we sent to<br><strong>nathanjamesgonzales09@gmail.com</strong> to finish
            setting up</p>

        <div class="code-label">Code</div>
        <input type="text" class="code-input" placeholder="Confirmation code (sent via email, e.g., 12345678 or ABC)">

        <button class="login-btn register-btn">
            Continue
        </button>

        <div class="divider">OR</div>

        <button class="login-btn google-btn">
            <img src="images/google-color-svgrepo-com.svg" alt="Google">
            Continue with Google
        </button>

        <div class="resend-code">
            Didn't get the code? <a href="#">Resend code</a>
        </div>
    </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>

    <script src="../app.js"></script>
</body>

</html>
