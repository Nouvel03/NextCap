<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>NextCap - OTP</title>
    <!-- Google Identity Services - Required for Google Sign-In -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="logo">
        <img src="images/main-logo.svg" alt="NextCap Logo" class="logo-img">

        <div class="logo-text">
            <h1 class="logo-title">NextCap</h1>
            <p class="logo-subtitle">
                Advancing Scholarship Applications for Tomorrow’s Leaders
            </p>
        </div>
    </div>

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>
        <h2>You're almost signed up</h2>
        <p class="subtitle">Enter the code we sent to<br><strong>nathanjamesgonzales09@gmail.com</strong> to finish
            setting up</p>

        <div class="code-label">Code</div>
        <input type="text" class="code-input" placeholder="Confirmation code (sent via email, e.g., 12345678 or ABC)">

        <button class="login-btn register-btn">
            Continue
        </button>

        <div class="divider">OR</div>

        <button class="login-btn google-btn">
            <img src="images/google-color-svgrepo-com.svg" alt="Google">
            Continue with Google
        </button>

        <div class="resend-code">
            Didn't get the code? <a href="#">Resend code</a>
        </div>
    </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>

    <script src="../app.js"></script>
</body>

</html>
