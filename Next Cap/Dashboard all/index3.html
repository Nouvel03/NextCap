<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Dashboard</title>
    <link rel="stylesheet" href="index3.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Secrets Config -->
    <script src="../utils/secrets.js"></script>
</head>

<body>
    <div class="header">
        <img src="images/logo.svg" alt="Logo" class="logo">
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="user-avatar"></div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Menu</div>
            <a href="index1.html" class="menu-item">
                <img src="images/dashboard-svgrepo-com 1.svg" alt="" class="menu-icon">
                Home
            </a>
            <a href="#" class="menu-item active">
                <img src="images/dashboard-svgrepo-com 2.svg" alt="" class="menu-icon">
                Dashboard
            </a>
            <a href="indexInformation.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Information
            </a>
            <a href="#" class="menu-item">
                <img src="images/dashboard-svgrepo-com 1.svg" alt="" class="menu-icon">
                Profile
            </a>
        </div>

        <div class="main-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-header">
                        <span>Profile Completion</span>
                        <span class="stat-value">80%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 80%"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>Active Applications</span>
                        <span class="stat-value" id="active-applications-count">0</span>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>Saved Scholarships</span>
                        <span class="stat-value">0</span>
                    </div>
                    <div class="progress-bar green">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-header">
                        <span>Upcoming Deadlines</span>
                        <span class="stat-value">0</span>
                    </div>
                    <div class="progress-bar green">
                        <div class="progress-fill" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <section class="updates-section">
                <h2>Updates</h2>
                <div class="update-message">
                    Welcome to your dashboard.
                </div>
            </section>

            <div class="application-grid" style="display:block;">
                <!-- Changed from grid to block to fit cards better if needed, or keep grid -->
                <div class="application-section" style="width:100%;">
                    <h3>My Applications</h3>
                    <!-- Dynamic Container -->
                    <div id="applied-scholarships-container"
                        style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
                        <p style="color:#718096">Loading applications...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="scholarship_array.js"></script>
</body>

</html>
