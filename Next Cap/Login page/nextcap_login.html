<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>NextCap - Login</title>
    <link rel="icon" href="../favicon_io/favicon.ico" type="image/x-icon">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="../utils/secrets.js"></script>
</head>

<body>
    <div class="logo">
        <img src="images/Group 21.svg" alt="Scholarly Logo">
    </div>

    <div class="cap">
        <img src="images/Group 11.svg" alt="tilted graduation cap">
    </div>

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>

        <h2>Log in or sign up in<br>seconds</h2>

        <button class="login-btn google-btn" id="google-login-btn">
            <img src="images/google-color-svgrepo-com.svg" alt="Google">
            Continue with Google
        </button>

        <button class="login-btn" id="email-signup-btn"
            onclick="location.href=encodeURI('../continue with email/continue with email.html')">
            Sign up with email
        </button>

        <button class="login-btn" id="email-login-btn"
            onclick="location.href=encodeURI('../login with email/login_with_email.html')">
            Login with email
        </button>

    </div>

    <div class="bottom-shapes">
        <img src="images/Group 19.svg">
    </div>

    <script type="module" src="../utils/app.js"></script>
</body>

</html>
