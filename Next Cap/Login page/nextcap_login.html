<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>NextCap - Login</title>
</head>
<body>
    <div class="logo">
        <img src="images/Group 21.svg" alt="Scholarly Logo">
    </div>

    <div class="cap">
        <img src="images/Group 11.svg" alt="tilted graduation cap">
    </div>

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>

        <h2>Log in or sign up in<br>seconds</h2>
        
        <button class="login-btn google-btn">
            <img src="images/google-color-svgrepo-com.svg" alt="Google">
            Continue with Google
        </button>
        
        <button class="login-btn">
            Continue with email
        </button>
        
        <button class="login-btn register-btn">
            Register
        </button>
    </div>

    <div class="bottom-shapes">
         <img src="images/Group 19.svg">
    </div>
</body>
</html>
