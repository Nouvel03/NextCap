<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications | NextCap</title>
    <link rel="icon" href="../favicon_io/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./indexExcel.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Secrets Config -->
    <script src="../utils/secrets.js"></script>
</head>

<body>

    <div class="header">
        <img src="images/logo.svg" alt="Logo" class="logo">
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="user-profile">
            <div class="user-avatar"></div>
            <span class="user-name">Hello Admin</span>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Admin Menu</div>
            <!-- Dashboard removed -->
            <a href="indexAdmin.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Manage Scholarships
            </a>
            <a href="indexUpload.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Create Scholarships
            </a>
            <a href="indexExcel.html" class="menu-item active">
                <img src="images/active.svg" alt="" class="menu-icon">
                Applications Overview
            </a>
            <a href="indexManageForums.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Manage Forums
            </a>
            <!-- Profile Settings removed -->
        </div>

        <div class="main-content">
            <div class="table-wrapper">
                <table>
                    <tr class="grid-header">
                        <th class="row-index"></th>
                        <th>A</th>
                        <th>B</th>
                        <th>C</th>
                        <th>D</th>
                    </tr>
                    <tr class="content-header">
                        <td class="row-num">1</td>
                        <th>Student Name</th>
                        <th>Scholarship Name</th>
                        <th>Status</th>
                        <th>Submission Date</th>
                    </tr>
                    <tr>
                        <td class="row-num">2</td>
                        <td></td>
                        <td class="selected-cell"></td>
                        <td>
                            <span class="status-legend">
                                <span class="status-submitted">Submitted</span> /
                                <span class="status-review">Under Review</span> /
                                <span class="status-approved">Approved</span> /
                                <span class="status-rejected">Rejected</span>
                            </span>
                        </td>
                        <td></td>
                    </tr>
                </table>
            </div>

            <div class="action-footer">
                <button class="btn btn-view">View Application & Documents</button>
                <button class="btn btn-status">Change Status</button>
                <button class="btn btn-message">Send Message</button>
            </div>
        </div>
    </div>
</body>
<script type="module" src="./indexExcel.js"></script>

</html>
