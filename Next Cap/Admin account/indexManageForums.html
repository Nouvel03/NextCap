<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Forums | NextCap Admin</title>
    <link rel="icon" href="../favicon_io/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="./indexAdmin.css">

    <!-- Forum Styles (Reused) -->
    <link rel="stylesheet" href="../Dashboard all/index1.css">
    <link rel="stylesheet" href="../Dashboard all/styles_forum.css">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Secrets Config -->
    <script src="../utils/secrets.js"></script>
    <!-- Firebase Init -->
    <script src="../utils/firebase_init.js"></script>

    <style>
        .admin-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            border-top: 1px solid #edf2f7;
            padding-top: 10px;
        }

        .btn-delete {
            background-color: #e53e3e;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-delete:hover {
            background-color: #c53030;
        }

        .delete-reply-btn {
            color: #e53e3e;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            margin-left: auto;
            align-self: flex-start;
        }

        .delete-reply-btn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="header">
        <img src="images/logo.svg" alt="Logo" class="logo">
        <div class="search-bar">
            <input type="text" placeholder="Search forums...">
        </div>
        <div class="user-profile">
            <div class="user-avatar"></div>
            <span class="user-name">Admin</span>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Admin Menu</div>

            <a href="indexAdmin.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Manage Scholarships
            </a>

            <a href="indexUpload.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Create Scholarships
            </a>

            <a href="indexManageForums.html" class="menu-item active">
                <img src="images/active.svg" alt="" class="menu-icon">
                Manage Forums
            </a>

            <a href="#" class="menu-item" onclick="logout()">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Log out
            </a>
        </div>

        <div class="main-content">
            <div class="forum-header-row">
                <div class="forum-title">Manage Community Forums</div>
            </div>

            <div id="forum-posts-container">
                <div style="text-align:center; padding:20px; color:#a0aec0;">Loading discussions...</div>
            </div>

            <div id="forum-post-detail-container" style="display: none;">
            </div>
        </div>
    </div>

    <script type="module" src="./manageForums.js"></script>
    <script src="../Dashboard all/logout.js"></script>
</body>

</html>
