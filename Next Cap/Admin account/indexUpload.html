<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Create Scholarships</title>
    <link rel="stylesheet" href="./indexUpload.css">
    <script>console.log('inline: indexUpload.html loaded');</script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>
    <script type="module" src="./indexUpload.js"></script>
</head>

<body>

    <div class="header">
        <img src="images/logo.svg" alt="Logo" class="logo">
        <div class="search-bar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="user-profile">
            <div class="user-avatar"></div>
            <span class="user-name">Hello Admin</span>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">Admin Menu</div>
            <a href="indexAdmin.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Dashboard
            </a>
            <a href="indexAdmin.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Manage Scholarships
            </a>
            <a href="indexUpload.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Create Scholarships
            </a>
            <a href="indexExcel.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Applications Overview
            </a>
            <a href="indexAdmin.html" class="menu-item">
                <img src="images/not-active.svg" alt="" class="menu-icon">
                Profile Settings
            </a>
        </div>

        <div class="main-content">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-avatar"></div>
                    <div class="form-info">
                        <input id="school-input" class="form-input" placeholder="School / Grant"
                            style="font-size:16px; font-weight:700; padding:8px 10px; border-radius:8px;" />
                        <div style="font-size: 12px; color: #6b7280;">Jan 24 2026<br>12:30pm</div>
                    </div>
                </div>

                <label class="upload-area" for="photo-input" tabindex="0" role="button">
                    <span class="upload-text">Upload Photo</span>
                    <input type="file" id="photo-input" accept="image/*" class="upload-input" />
                </label>

                <div class="input-group" style="margin-top: 15px;">
                    <label class="input-label">Title</label>
                    <input id="title-input" class="form-input" placeholder="Title"
                        style="width: 100%; font-size: 16px; padding: 10px;">
                </div>



                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label">Description</label>
                        <textarea id="desc-input" class="form-input"></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Tags</label>
                        <input id="tag-input" type="text" class="form-input" style="margin-bottom: 10px;"
                            placeholder="Add tag and press Enter">
                        <div id="tags-container" class="tags-input-container">
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label">Application Deadline</label>
                        <input id="deadline-input" type="date" class="form-input">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Number of slots</label>
                        <input id="slots-input" type="text" class="form-input">
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Requirements List</label>
                    <input id="req-input" type="text" class="form-input" style="margin-bottom: 10px;"
                        placeholder="Add requirement and press Enter">
                    <div id="req-container" class="tags-input-container">
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-cancel">Cancel</button>
                    <button class="btn btn-draft">Draft</button>
                    <button id="post-btn" class="btn btn-post">Post</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
