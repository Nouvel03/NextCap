<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextCap - Create account</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="logo">
        <img src="images/Group 21.svg" alt="Scholarly Logo">
    </div>

    <div class="cap">
        <img src="images/Group 11.svg" alt="tilted graduation cap">
    </div>

    <div class="login-container">
        <button class="back-button">
            <img src="images/back-svgrepo-com (1).svg" alt="Back">
        </button>
        <h2>Create your account</h2>
        <p class="subtitle">You're creating a NextCap account with <strong>xdthrmhsxcr@gmail.com</strong></p>
        
        <div class="form-group">
            <label for="code">Your name</label>
            <input type="text" id="code" placeholder="e.g., Anthony Bourdain / Anthony / Tony / ant">
        </div>
        <button class="continue-btn">Continue</button>
    </div>

    <div class="bottom-shapes">
       <img src="images/Group 19.svg">
    </div>
</body>
</html>
