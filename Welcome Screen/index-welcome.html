<!DOCTYPE html>

    <link rel="stylesheet" href="style-welcome.css">
    <script type = "module" src="../Welcome Screen/js-welcome.js "></script>
</head>

    <div class="logo">
        <img src="images/main-logo.svg" alt="NextCap Logo" class="logo-img">
